<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meal Planner tests</title>
  <style>
    :root { --bg: #101217; --surface: #1a1d24; --border: #2e3340; --text: #eceef3; --muted: #9aa2b1; --ok: #3fb37f; --fail: #ef5350; color-scheme: dark; }
    @media (prefers-color-scheme: light) { :root { --bg: #f3f4f7; --surface: #fff; --border: #d8dbe2; --text: #15171c; --muted: #5d6573; --ok: #1f8a5b; --fail: #d93636; color-scheme: light; } }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 900px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.4rem; margin: 4px 0 8px; }
    .muted { color: var(--muted); }
    button { font: inherit; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: inherit; cursor: pointer; }
    #summary { font-size: 1.15rem; font-weight: 700; margin: 12px 0; }
    #summary.pass { color: var(--ok); } #summary.fail { color: var(--fail); }
    .scenario { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; margin: 10px 0; }
    .scenario h2 { font-size: 1.02rem; margin: 0 0 4px; display: flex; justify-content: space-between; gap: 8px; }
    .check { display: grid; grid-template-columns: 1.4em 1fr; gap: 4px; padding: 2px 0; font-size: .92rem; }
    .check.fail { color: var(--fail); }
    .check .detail { grid-column: 2; color: var(--muted); font-size: .82rem; white-space: pre-wrap; word-break: break-word; }
    .ok { color: var(--ok); } .bad { color: var(--fail); }
    #stage { position: fixed; right: 8px; bottom: 8px; width: 390px; height: 700px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: #000; opacity: .25; pointer-events: none; }
    #stage iframe { width: 100%; height: 100%; border: 0; }
    @media (max-width: 1300px) { #stage { width: 1px; height: 1px; opacity: 0; } }
  </style>
</head>
<body>
  <main>
    <h1>Meal Planner tests</h1>
    <p class="muted">Each scenario runs the real app in a hidden frame against its own test database (<code>meal-planner-test</code>),
      with Google Drive faked. Your real data, Drive and the offline cache are never touched. Runs on localhost only.</p>
    <p><button id="run">Run all tests</button> <span class="muted" id="status"></span></p>
    <div id="summary"></div>
    <div id="results"></div>
  </main>
  <div id="stage"></div>
  <script src="tests/suite.js"></script>
</body>
</html>
