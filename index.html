<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101217">
  <meta name="description" content="Weekly meal plan, shopping list, pantry and meal log">
  <title>Meal Planner</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <span class="top-title">Meal Planner</span>
    <button class="top-menu" data-action="menu" aria-label="Menu">⋮</button>
  </header>

  <main id="app"><p class="muted center">Loading…</p></main>

  <nav class="tabs">
    <button data-action="view" data-view="today">Today</button>
    <button data-action="view" data-view="week">Week</button>
    <button data-action="view" data-view="shop">Shop</button>
    <button data-action="view" data-view="pantry">Pantry</button>
    <button data-action="view" data-view="recipes">Recipes</button>
  </nav>

  <div id="modal" hidden></div>
  <div id="toast" role="status"></div>

  <script src="seed.js"></script>
  <script src="app.js"></script>
</body>
</html>
